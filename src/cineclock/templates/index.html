{% extends "base.html" %}
{% from "_parts.html" import day_sections, date_strip %}

{% block main %}
<div class="wrap">
  {{ date_strip(days) }}
  {% if days %}
    {{ day_sections(days, root) }}
  {% else %}
    <p class="empty">No showtimes saved yet. Run <code>python -m cineclock.scrape</code> to fetch them.</p>
  {% endif %}
</div>
{% endblock %}
