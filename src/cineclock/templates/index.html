{% extends "base.html" %}
{% from "_parts.html" import rail %}

{% block main %}
<div class="wrap">
  {% if rails %}
    {% for r in rails %}{{ rail(r, root) }}{% endfor %}
    <p class="all-showtimes"><a href="{{ root }}showtimes/">All showtimes, day by day</a></p>
  {% else %}
    <p class="empty">No showtimes saved yet. Run <code>python -m cineclock.scrape</code> to fetch them.</p>
  {% endif %}
</div>
{% endblock %}
