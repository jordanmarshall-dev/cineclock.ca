name: IMDb check

# Run by hand: can IMDb's watchlist API be read from GitHub, and through the
# Worker? Results show as annotations on the run's page.
on:
  workflow_dispatch:
    inputs:
      user:
        description: An IMDb user id with a public watchlist
        default: ur210314200

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check
        env:
          USER_ID: ${{ inputs.user }}
        run: |
          note() { echo "::notice title=$1::$(echo "$2" | tr '\n' ' ' | cut -c1-900)"; }
          q='{"query":"query ($user: ID!) { predefinedList(classType: WATCH_LIST, userId: $user) { id } }","variables":{"user":"'"$USER_ID"'"}}'
          note "direct" "$(curl -sS -m 20 -w ' HTTP %{http_code}' -X POST -H 'Content-Type: application/json' -H 'x-imdb-client-name: imdb-web-next' -H 'Referer: https://www.imdb.com/' -d "$q" https://api.graphql.imdb.com/ 2>&1)"
          note "worker" "$(curl -sS -m 30 -w ' HTTP %{http_code}' https://cineclock-relay.cineclock-relay.workers.dev/imdb/$USER_ID 2>&1 | cut -c1-400)"
          note "api" "$(curl -sS -m 30 -w ' HTTP %{http_code}' https://api.cineclock.ca/imdb/$USER_ID 2>&1 | cut -c1-400)"
          note "browser preflight" "$(curl -sS -m 20 -o /dev/null -D - -X OPTIONS -H 'Origin: https://cineclock.ca' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type,x-imdb-client-name' https://api.graphql.imdb.com/ 2>&1 | grep -i -E '^HTTP|access-control')"
          note "browser post" "$(curl -sS -m 20 -o /dev/null -D - -X POST -H 'Origin: https://cineclock.ca' -H 'Content-Type: application/json' -d "$q" https://api.graphql.imdb.com/ 2>&1 | grep -i -E '^HTTP|access-control')"
          items='{"query":"query ($id: ID!) { list(id: $id) { items(first: 5) { edges { node { listItem { ... on Title { id } } } } pageInfo { hasNextPage } } } }","variables":{"id":"ls4157365647"}}'
          note "items" "$(curl -sS -m 20 -X POST -H 'Content-Type: application/json' -H 'x-imdb-client-name: imdb-web-next' -d "$items" https://api.graphql.imdb.com/ 2>&1 | cut -c1-500)"
