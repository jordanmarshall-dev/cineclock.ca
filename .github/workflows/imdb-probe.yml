name: IMDb probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          ask() { curl -sS -m 20 -X POST -H 'Content-Type: application/json' -H 'x-imdb-client-name: imdb-web-next' -d "$1" https://api.graphql.imdb.com/ | cut -c1-700; }
          note() { echo "::notice title=$1::$(echo "$2" | tr '\n' ' ')"; }
          note byuser "$(ask '{"query":"{ userProfile(input: { userId: \"ur206781881\" }) { userId profileId username { text } } }"}')"
          note byname "$(ask '{"query":"{ userProfile(input: { username: \"JordanM-078\" }) { userId } }"}')"
